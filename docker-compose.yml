version: "3.8"

services:
  frontend:
    build:
      context: ./frontend-redirect
      dockerfile: Dockerfile
    container_name: tempohub-redirect
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempohub.rule=Host(`tempo-hub.fr`)"
      - "traefik.http.routers.tempohub.entrypoints=websecure"
      - "traefik.http.routers.tempohub.tls.certresolver=letsencrypt"
      - "traefik.http.services.tempohub.loadbalancer.server.port=80"

networks:
  web:
    external: true
