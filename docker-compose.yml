version: "3.8"

services:
  frontend:
    build:
      context: ./frontend-redirect
      dockerfile: Dockerfile
    container_name: tempohub-redirect
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      # HTTPS router (main)
      - "traefik.http.routers.tempohub.rule=Host(`tempo-hub.fr`) || Host(`www.tempo-hub.fr`)"
      - "traefik.http.routers.tempohub.entrypoints=websecure"
      - "traefik.http.routers.tempohub.tls.certresolver=letsencrypt"
      - "traefik.http.services.tempohub.loadbalancer.server.port=80"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.tempohub-http.rule=Host(`tempo-hub.fr`) || Host(`www.tempo-hub.fr`)"
      - "traefik.http.routers.tempohub-http.entrypoints=web"
      - "traefik.http.routers.tempohub-http.middlewares=tempohub-https-redirect"
      - "traefik.http.middlewares.tempohub-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.tempohub-https-redirect.redirectscheme.permanent=true"

networks:
  web:
    external: true
