backend:
  name: git-gateway
  branch: main

# When running locally with npx decap-server
local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

# Show preview links to the live site
show_preview_links: true

collections:
  # ──────────────────────────────────────
  # Site settings (single file, no i18n)
  # ──────────────────────────────────────
  - name: settings
    label: "⚙️ Settings"
    description: "Site identity, contact info and social links"
    files:
      - name: general
        label: General Settings
        file: content/settings/general.json
        fields:
          - { label: Site Name, name: siteName, widget: string }
          - { label: Profession / Tagline, name: profession, widget: string }
          - { label: Logo, name: logo, widget: image, required: false }
          - { label: Favicon, name: favicon, widget: image, required: false }
          - label: Contact
            name: contact
            widget: object
            fields:
              - { label: Email, name: email, widget: string }
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: Address, name: address, widget: string, required: false }
          - label: Social Links
            name: social
            widget: object
            fields:
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: Twitter / X, name: twitter, widget: string, required: false }

  # ──────────────────────────────────────
  # Blog articles
  # ──────────────────────────────────────
  - name: blog
    label: "📝 Blog"
    description: "Blog articles with rich text editor"
    folder: content/{{locale}}/blog
    create: true
    slug: "{{slug}}"
    i18n:
      structure: multiple_folders
      locales: [fr, en]
      default_locale: fr
    preview_path: "blog/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Description, name: description, widget: string, i18n: true, hint: "Short summary shown in blog listing and SEO" }
      - { label: Date, name: date, widget: datetime }
      - { label: Cover Image, name: image, widget: image, required: false }
      - label: Body
        name: body
        widget: markdown
        i18n: true
        toolbar_buttons:
          main:
            - bold
            - italic
            - code
            - link
            - heading-two
            - heading-three
            - heading-four
            - quote
            - bulleted-list
            - numbered-list
          empty: []

  # ──────────────────────────────────────
  # Content pages (section-based)
  # ──────────────────────────────────────
  - name: pages
    label: "📄 Pages"
    description: "Section-based pages (hero, features, pricing...)"
    folder: content/{{locale}}/pages
    create: true
    slug: "{{slug}}"
    i18n:
      structure: multiple_folders
      locales: [fr, en]
      default_locale: fr
    preview_path: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Description, name: description, widget: string, i18n: true, hint: "SEO meta description" }
      - label: Sections
        name: sections
        widget: list
        i18n: true
        fields:
          - label: Type
            name: type
            widget: select
            options:
              - { label: "🎯 Hero", value: hero }
              - { label: "⭐ Features", value: features }
              - { label: "💰 Pricing", value: pricing }
              - { label: "💬 Testimonials", value: testimonials }
              - { label: "❓ FAQ", value: faq }
              - { label: "📢 Call to Action", value: cta }
              - { label: "📧 Contact", value: contact }
              - { label: "📊 Stats", value: stats }
              - { label: "🏢 Logos", value: logos }
          - label: Props (JSON)
            name: props
            widget: code
            default_language: json
            output_code_only: true
            hint: "Section properties as JSON. See docs for each section type."

  # ──────────────────────────────────────
  # Testimonials
  # ──────────────────────────────────────
  - name: testimonials
    label: "💬 Testimonials"
    description: "Client testimonials and reviews"
    folder: content/{{locale}}/testimonials
    create: true
    slug: "{{slug}}"
    i18n:
      structure: multiple_folders
      locales: [fr, en]
      default_locale: fr
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Role / Company, name: role, widget: string, i18n: true }
      - { label: Photo, name: photo, widget: image, required: false }
      - label: Quote
        name: quote
        widget: markdown
        i18n: true
        minimal: true
        toolbar_buttons:
          main:
            - bold
            - italic
            - link
          empty: []
        hint: "Client testimonial text. Use bold for emphasis."
      - { label: "Rating (1-5)", name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - { label: Display Order, name: order, widget: number, value_type: int, default: 0, hint: "Lower number = appears first" }

  # ──────────────────────────────────────
  # FAQ
  # ──────────────────────────────────────
  - name: faq
    label: "❓ FAQ"
    description: "Frequently asked questions"
    folder: content/{{locale}}/faq
    create: true
    slug: "{{slug}}"
    i18n:
      structure: multiple_folders
      locales: [fr, en]
      default_locale: fr
    fields:
      - { label: Question, name: question, widget: string, i18n: true }
      - label: Answer
        name: answer
        widget: markdown
        i18n: true
        toolbar_buttons:
          main:
            - bold
            - italic
            - code
            - link
            - bulleted-list
            - numbered-list
          empty: []
        hint: "Use the toolbar above to format your answer (bold, lists, links...)"
      - { label: Category, name: category, widget: string, required: false, i18n: true, hint: "Group related questions (e.g. General, Pricing, Technical)" }
      - { label: Display Order, name: order, widget: number, value_type: int, default: 0, hint: "Lower number = appears first" }

  # ──────────────────────────────────────
  # Projects / Portfolio
  # ──────────────────────────────────────
  - name: projects
    label: "🎨 Projects"
    description: "Portfolio and case studies"
    folder: content/{{locale}}/projects
    create: true
    slug: "{{slug}}"
    i18n:
      structure: multiple_folders
      locales: [fr, en]
      default_locale: fr
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - label: Short Description
        name: description
        widget: markdown
        i18n: true
        minimal: true
        toolbar_buttons:
          main:
            - bold
            - italic
            - link
          empty: []
        hint: "Brief summary shown in portfolio grid"
      - { label: Cover Image, name: image, widget: image }
      - { label: Project URL, name: url, widget: string, required: false, hint: "Link to live website" }
      - { label: Date, name: date, widget: datetime }
      - label: Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
        hint: "e.g. Showcase, E-commerce, Animations"
      - { label: Featured, name: featured, widget: boolean, default: false, hint: "Show on homepage" }
      - label: Case Study
        name: body
        widget: markdown
        i18n: true
        required: false
        toolbar_buttons:
          main:
            - bold
            - italic
            - code
            - link
            - heading-two
            - heading-three
            - quote
            - bulleted-list
            - numbered-list
          empty: []
        hint: "Detailed case study with results, process, etc."
